<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sign Up | IgniteTravel — Create Your Account</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Favicon -->
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/201/201623.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              red: '#dc2626',
              black: '#0a0a0a',
              dark: '#111111'
            }
          }
        }
      }
    }
  </script>

    <script>
      (function() {
        var theme = localStorage.getItem('travel-theme') || (localStorage.getItem('travel-dark') === 'true' ? 'dark' : (localStorage.getItem('travel-dark') === 'false' ? 'light' : null));
        if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        var rtl = localStorage.getItem('travel-rtl');
        if (rtl === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
        } else {
          document.documentElement.setAttribute('dir', 'ltr');
        }
      })();
    </script>

  <style>
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      min-height: 100vh;
      width: 100vw;
    }

    .transition-theme {
      transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
    }

    /* ═══════════ TOGGLE BUTTONS ═══════════ */
    .toggle-btn {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      position: relative;
    }
    .toggle-btn:hover {
      border-color: #dc2626 !important;
      color: #dc2626 !important;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(220, 38, 38, 0.25) !important;
    }
    .toggle-btn:active {
      transform: translateY(0) scale(0.95);
    }
    .dark .toggle-btn:hover {
      box-shadow: 0 8px 20px rgba(220, 38, 38, 0.35) !important;
    }

    /* Icon rotation on theme toggle */
    #darkIcon {
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #darkToggle:hover #darkIcon {
      transform: rotate(25deg) scale(1.1);
    }

    /* ═══════════ TOOLTIP ═══════════ */
    .toggle-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: #18181b;
      color: #ffffff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.35rem 0.6rem;
      border-radius: 8px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 200;
      letter-spacing: 0.02em;
    }
    .dark .toggle-btn::after {
      background: #ffffff;
      color: #0a0a0a;
    }
    .toggle-btn:hover::after {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    /* ═══════════ CARD ENTRANCE ANIMATION ═══════════ */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
      animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ═══════════ FLOATING LABEL INPUTS ═══════════ */
    .input-group {
      position: relative;
    }
    .input-group input {
      width: 100%;
      padding: 1.1rem 1rem 0.4rem 2.5rem;
      border-radius: 0.75rem;
      border: 1px solid #e4e4e7;
      background: #fafafa;
      font-size: 0.9rem;
      font-weight: 500;
      color: #18181b;
      transition: all 0.2s ease;
      outline: none;
    }
    .dark .input-group input {
      background: #0a0a0a;
      border-color: #27272a;
      color: #ffffff;
    }
    .input-group input:focus {
      border-color: #dc2626;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.1);
    }
    .dark .input-group input:focus {
      background: #0a0a0a;
    }
    .input-group label {
      position: absolute;
      left: 2.5rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      font-weight: 500;
      color: #a1a1aa;
      pointer-events: none;
      transition: all 0.2s ease;
    }
    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label {
      top: 0.45rem;
      transform: translateY(0);
      font-size: 0.6rem;
      color: #dc2626;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    [dir="rtl"] .input-group input { padding: 1.1rem 2.5rem 0.4rem 1rem; }
    [dir="rtl"] .input-group label { left: auto; right: 2.5rem; }

    .input-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: #dc2626;
      font-size: 0.9rem;
      pointer-events: none;
      transition: all 0.2s ease;
    }
    [dir="rtl"] .input-icon { left: auto; right: 0.85rem; }

    /* ═══════════ RTL FIX FOR PASSWORD EYES ═══════════ */
    [dir="rtl"] #togglePassword,
    [dir="rtl"] #toggleConfirmPassword {
      right: auto;
      left: 0.75rem;
    }

    /* ═══════════ DOTTED BACKGROUND PATTERN ═══════════ */
    .dot-pattern {
      background-image: radial-gradient(circle, rgba(220, 38, 38, 0.08) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    .dark .dot-pattern {
      background-image: radial-gradient(circle, rgba(220, 38, 38, 0.12) 1px, transparent 1px);
    }

    /* ═══════════ PASSWORD STRENGTH BAR ═══════════ */
    .strength-bar {
      height: 3px;
      border-radius: 999px;
      background: #e4e4e7;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .dark .strength-bar { background: #27272a; }
    .strength-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .strength-weak   { width: 33%; background: #ef4444; }
    .strength-medium { width: 66%; background: #f59e0b; }
    .strength-strong { width: 100%; background: #22c55e; }

    /* ═══════════ HIDE SCROLLBARS ═══════════ */
    ::-webkit-scrollbar { display: none; }
    html { scrollbar-width: none; -ms-overflow-style: none; }

    /* ═══════════ RESPONSIVE ADJUSTMENTS ═══════════ */
    @media (min-width: 768px) and (max-width: 1024px) {
      .login-card { max-width: 460px; }
      .toggle-btn { width: 44px !important; height: 44px !important; }
      .toggle-btn i { font-size: 1.1rem !important; }
    }

    @media (max-width: 480px) {
      .card-wrapper { padding-left: 1rem; padding-right: 1rem; }
      .toggle-btn { width: 40px !important; height: 40px !important; }
      .toggle-btn::after { font-size: 0.6rem; }
    }

    @media (max-width: 360px) {
      .toggle-btn { width: 36px !important; height: 36px !important; }
    }
  </style>
</head>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // 🔴 FIXED: html was undefined in the original code
      const html = document.documentElement;
      const darkToggle = document.getElementById('darkToggle');
      const darkIcon = document.getElementById('darkIcon');
      const rtlToggle = document.getElementById('rtlToggle');

      // ============================================================
      // ===== THEME (Dark / Light) HANDLING =====
      // ============================================================
      const updateThemeIcon = (isDark) => {
        if (isDark) {
          darkIcon.className = 'fa-solid fa-sun text-sm sm:text-base';
          darkToggle.setAttribute('data-tooltip', 'Switch to Light');
        } else {
          darkIcon.className = 'fa-solid fa-moon text-sm sm:text-base';
          darkToggle.setAttribute('data-tooltip', 'Switch to Dark');
        }
      };

      // Load saved theme OR system preference
      const savedTheme = localStorage.getItem('travel-theme') || (localStorage.getItem('travel-dark') === 'true' ? 'dark' : (localStorage.getItem('travel-dark') === 'false' ? 'light' : null));
      if (savedTheme === 'dark') {
        html.classList.add('dark');
        updateThemeIcon(true);
      } else if (savedTheme === 'light') {
        html.classList.remove('dark');
        updateThemeIcon(false);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        html.classList.add('dark');
        updateThemeIcon(true);
      } else {
        updateThemeIcon(false);
      }

      // Theme toggle click
      darkToggle.addEventListener('click', function () {
        const isDark = html.classList.toggle('dark');
        localStorage.setItem('travel-theme', isDark ? 'dark' : 'light');
        localStorage.setItem('travel-dark', isDark ? 'true' : 'false');
        updateThemeIcon(isDark);
      });

      // Listen for system theme changes
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          if (!localStorage.getItem('travel-theme')) {
            html.classList.toggle('dark', e.matches);
            updateThemeIcon(e.matches);
          }
        });
      }

      // ============================================================
      // ===== RTL / LTR HANDLING =====
      // ============================================================
      const updateRtlTooltip = () => {
        const isRtl = html.getAttribute('dir') === 'rtl';
        rtlToggle.setAttribute('data-tooltip', isRtl ? 'Switch to LTR' : 'Switch to RTL');
      };

      // Load saved RTL preference
      const savedRtl = localStorage.getItem('travel-rtl');
      if (savedRtl === 'rtl') {
        html.setAttribute('dir', 'rtl');
      } else {
        html.setAttribute('dir', 'ltr');
      }
      updateRtlTooltip();

      // RTL toggle click
      rtlToggle.addEventListener('click', function () {
        const isRtl = html.getAttribute('dir') === 'rtl';
        const newDir = isRtl ? 'ltr' : 'rtl';
        html.setAttribute('dir', newDir);
        localStorage.setItem('travel-rtl', newDir);
        updateRtlTooltip();
      });

      // ============================================================
      // ===== PASSWORD VISIBILITY TOGGLE (Main) =====
      // ============================================================
      const togglePassword = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const togglePasswordIcon = document.getElementById('togglePasswordIcon');

      togglePassword.addEventListener('click', function () {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        togglePasswordIcon.className = isPassword
          ? 'fa-solid fa-eye-slash text-xs'
          : 'fa-solid fa-eye text-xs';
      });

      // ============================================================
      // ===== PASSWORD VISIBILITY TOGGLE (Confirm) =====
      // ============================================================
      const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const toggleConfirmPasswordIcon = document.getElementById('toggleConfirmPasswordIcon');

      toggleConfirmPassword.addEventListener('click', function () {
        const isPassword = confirmPasswordInput.type === 'password';
        confirmPasswordInput.type = isPassword ? 'text' : 'password';
        toggleConfirmPasswordIcon.className = isPassword
          ? 'fa-solid fa-eye-slash text-xs'
          : 'fa-solid fa-eye text-xs';
      });

      // ============================================================
      // ===== PASSWORD STRENGTH METER =====
      // ============================================================
      const strengthFill = document.getElementById('strengthFill');
      const strengthText = document.getElementById('strengthText');

      passwordInput.addEventListener('input', function () {
        const val = passwordInput.value;
        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        strengthFill.className = 'strength-fill';
        if (val.length === 0) {
          strengthText.textContent = 'Password strength';
          strengthText.className = 'text-[9px] font-bold uppercase tracking-widest text-zinc-400 mt-1';
        } else if (score <= 1) {
          strengthFill.classList.add('strength-weak');
          strengthText.textContent = 'Weak password';
          strengthText.className = 'text-[9px] font-bold uppercase tracking-widest text-red-500 mt-1';
        } else if (score === 2 || score === 3) {
          strengthFill.classList.add('strength-medium');
          strengthText.textContent = 'Medium strength';
          strengthText.className = 'text-[9px] font-bold uppercase tracking-widest text-amber-500 mt-1';
        } else {
          strengthFill.classList.add('strength-strong');
          strengthText.textContent = 'Strong password';
          strengthText.className = 'text-[9px] font-bold uppercase tracking-widest text-green-500 mt-1';
        }
      });

      // ============================================================
      // ===== CONFIRM PASSWORD MATCH CHECK =====
      // ============================================================
      confirmPasswordInput.addEventListener('input', function () {
        if (confirmPasswordInput.value.length === 0) {
          confirmPasswordInput.classList.remove('border-red-500', 'border-green-500');
        } else if (confirmPasswordInput.value === passwordInput.value) {
          confirmPasswordInput.classList.remove('border-red-500');
          confirmPasswordInput.classList.add('border-green-500');
        } else {
          confirmPasswordInput.classList.remove('border-green-500');
          confirmPasswordInput.classList.add('border-red-500');
        }
      });

      // ============================================================
      // ===== KEYBOARD SHORTCUTS =====
      // ============================================================
      document.addEventListener('keydown', function (e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        if (e.key === 'd' || e.key === 'D') {
          if (!e.ctrlKey && !e.metaKey && !e.altKey) darkToggle.click();
        }
        if (e.key === 'r' || e.key === 'R') {
          if (!e.ctrlKey && !e.metaKey && !e.altKey) rtlToggle.click();
        }
      });

      console.log('%c🔐 IgniteTravel · Sign Up', 'font-size:18px;font-weight:bold;color:#dc2626;');
      console.log('%c💡 Press "D" to toggle Dark Mode · Press "R" to toggle RTL', 'font-size:11px;color:#6b7280;');
    });
  </script>

</body>
